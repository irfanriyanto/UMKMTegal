services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: umkm_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - umkm_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: umkm_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - umkm_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: umkm_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: umkm_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: umkm_user
      MYSQL_PASSWORD: umkm_password
    ports:
      - "3306:3306"
    volumes:
      - umkm_dbdata:/var/lib/mysql
    networks:
      - umkm_network

  node:
    image: node:20-alpine
    container_name: umkm_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - umkm_network

networks:
  umkm_network:
    driver: bridge

volumes:
  umkm_dbdata:
    driver: local
